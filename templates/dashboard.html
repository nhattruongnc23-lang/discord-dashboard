<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bảng điều khiển Meow Meow</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-body">

            <h2 class="text-center mb-4">
                🐱 Bảng điều khiển Meow Meow
            </h2>

            <div class="mb-3">

                <label class="form-label">
                    🖥 Máy chủ
                </label>

                <select class="form-select" id="guild">
                    <option>
                        Đang tải danh sách máy chủ...
                    </option>
                </select>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    💬 Kênh
                </label>

                <select class="form-select" id="channel">
                    <option>
                        Đang tải danh sách kênh...
                    </option>
                </select>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    📝 Nội dung thông báo
                </label>

                <textarea
                    class="form-control"
                    id="message"
                    rows="6"
                    placeholder="Nhập nội dung cần gửi tới Discord..."
                ></textarea>

            </div>

            <button
                class="btn btn-primary w-100"
                id="send">

                📨 Gửi thông báo

            </button>

        </div>

    </div>

</div>

<script src="/static/script.js"></script>

</body>
</html>
