{% extends "layout/base.html" %}

{% block title %}
Bảng điều khiển Meow Meow
{% endblock %}

{% block content %}

<div class="card shadow">

    <div class="card-body">

        <h2 class="text-center mb-4">

            🐱 Bảng điều khiển Meow Meow

        </h2>

        <div class="mb-3">

            <label class="form-label">

                🖥 Máy chủ

            </label>

            <select class="form-select" id="guild">

                <option>

                    Đang tải danh sách máy chủ...

                </option>

            </select>

        </div>

        <div class="mb-3">

            <label class="form-label">

                💬 Kênh

            </label>

            <select class="form-select" id="channel">

                <option>

                    Đang tải danh sách kênh...

                </option>

            </select>

        </div>

        <div class="mb-3">

            <label class="form-label">

                📝 Nội dung thông báo

            </label>

            <textarea
                class="form-control"
                id="message"
                rows="6"
                placeholder="Nhập nội dung cần gửi tới Discord..."
            ></textarea>

        </div>

        <button
            class="btn btn-primary w-100"
            id="send">

            📨 Gửi thông báo

        </button>

    </div>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

{% endblock %}
