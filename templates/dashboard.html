
{% extends "layout/base.html" %}

{% block title %}
Bảng điều khiển Meow Meow
{% endblock %}

{% block content %}

<div class="card shadow">

    <div class="card-body">

        <h2 class="text-center mb-4">
            🐱 Bảng điều khiển Meow Meow
        </h2>

        <!-- Danh sách Server -->

        <div class="mb-3">

            <label class="form-label">
                🖥 Máy chủ
            </label>

            <div id="guild-list" class="list-box">

                Đang tải...

            </div>

        </div>

        <!-- Danh sách Channel -->

        <div class="mb-3">

            <label class="form-label">
                💬 Kênh
            </label>

            <div id="channel-list" class="list-box">

                Đang tải danh sách kênh...

            </div>

        </div>

        <!-- Nội dung -->

        <div class="mb-3">

            <label class="form-label">
                📝 Nội dung thông báo
            </label>

            <textarea
                class="form-control"
                id="message"
                rows="6"
                placeholder="Nhập nội dung cần gửi tới Discord..."
            ></textarea>

        </div>

        <!-- Nút gửi -->

        <button
            class="btn btn-warning w-100"
            id="send">

            📨 Gửi thông báo

        </button>

        <!-- Thông báo -->

        <div id="send-status"></div>

    </div>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

{% endblock %}
