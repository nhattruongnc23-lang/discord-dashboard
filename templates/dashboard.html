{% extends "layout/base.html" %}

{% block title %}
Bảng điều khiển Meow Meow
{% endblock %}

{% block content %}

<div class="card shadow">

    <div class="card-body">

        <h2 class="text-center mb-4">
            🐱 Bảng điều khiển Meow Meow
        </h2>

        <!-- SERVER -->

        <div class="mb-3">

            <div class="section-header" onclick="toggleList('guild-list', this)">

                <span>🖥 Máy chủ</span>

                <span class="arrow">▼</span>

            </div>

            <div id="guild-list" class="list-box">

                Đang tải danh sách máy chủ...

            </div>

        </div>

        <!-- CHANNEL -->

        <div class="mb-3">

            <div class="section-header" onclick="toggleList('channel-list', this)">

                <span>💬 Kênh</span>

                <span class="arrow">▼</span>

            </div>

            <div id="channel-list" class="list-box">

                Đang tải danh sách kênh...

            </div>

        </div>

        <!-- MESSAGE -->

        <div class="mb-3">

            <label class="form-label">

                📝 Nội dung thông báo

            </label>

            <textarea
                class="form-control"
                id="message"
                rows="6"
                placeholder="Nhập nội dung cần gửi tới Discord..."></textarea>

        </div>

        <!-- BUTTON -->

        <button
            class="btn btn-warning w-100"
            id="send">

            📨 Gửi thông báo

        </button>

        <!-- STATUS -->

        <div id="send-status"></div>

    </div>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

{% endblock %}
